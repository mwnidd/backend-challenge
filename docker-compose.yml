services:
  api:
    build: .
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: backend_challenge
      JWT_SECRET: local-compose-secret
      JWT_TTL_HOURS: "24"
    ports:
      - "8080:8080"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

